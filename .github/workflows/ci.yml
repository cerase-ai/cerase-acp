name: CI

# Vitest + lint + tsc. Runs on every push to main and every PR
# targeting main. Decoupled from the Docker workflow so a slow
# image push never blocks the unit-test feedback loop.

on:
  # M-THE-ACTIONS-BILL-IS-ONE-JOB-IN-SEVEN-1: no standalone `push` trigger.
  # docker-publish.yml already runs this suite as its `gate` via workflow_call,
  # on every push to main and every v* tag, so a push trigger here ran every job
  # a SECOND time on the same commit. Measured 2026-08-20/21 across the five
  # repositories that had one: 184 jobs and 239 billed minutes over two days,
  # and 48 of 48 commits also ran the gate — not one standalone run was the only
  # coverage. cerase-core removed its own for this reason in M-CI-COST-2.
  #
  # Nothing loses coverage here: this trigger and the publish ignored the same
  # `devplan/**`, so every push that ran CI now runs it once through the gate.
  pull_request:
    branches: [main]
    paths-ignore:
      - 'devplan/**'
  # M-CI-1: callable as a gate from docker-publish.yml.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:biome

      - name: Type-check + build
        run: npm run build

      - name: Run vitest suite
        run: npm test

  image-scan:
    # M-ACP-NPM-STRIP-1 (2026-08-02): cerase-acp had NO image scan at all, while
    # its sibling cerase-agent — the same node base, the same bundled npm — was
    # gated by Trivy. The exposure here was never absent, only unalarmed, and an
    # asymmetry like that is how one of two identical images stays vulnerable.
    # Blocking, like cerase-agent's: HIGH/CRITICAL fails the job.
    name: trivy image scan (hard block)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the runtime image
        run: docker build -t cerase-acp:scan .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: cerase-acp:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  gitleaks:
    name: gitleaks (hard block)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # M-DOCS-PARITY-ALL-REPOS-1 — no document may name a command, file or path
      # that does not exist. A parity check that lives in one repo's local suite
      # is a check for one repo, so the same script runs in every repo's CI.
      - name: Docs parity
        run: bash scripts/docs-parity.sh

      # No comment carries what git already holds — a past date, a ticket ID,
      # or markup in an inline comment. Scoped to this push's own commits, so
      # it never reds on a legacy file nobody touched.
      - name: Comment convention
        run: bash scripts/comment-check.sh --base "${COMMENT_CHECK_BASE}"
        env:
          COMMENT_CHECK_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      # A0 step 4 · G2 + G3 — no credential file in this checkout, no retired
      # credential name in use. Same script in every repo, synced from core by
      # `scripts/sync-tooling.sh` and pinned by `scripts/TOOLING.sha256`: a
      # secrets guard that lives in one repo guards one repo.
      - name: Secrets guard
        run: bash scripts/secrets-guard.sh
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          # ⚠️ `--retry`, because this step HARD-BLOCKS a merge and its input is
          # a third party's CDN. Measured 2026-08-12: a 503 from the release
          # host reddened a repo whose code was fine, and a security gate that
          # fails on somebody else's outage is a gate people learn to re-run
          # without reading. Retries on transient status too, not only on
          # connection errors — a 503 IS the case that happened.
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan repository history
        run: gitleaks detect --source . --redact --verbose --exit-code 1
