name: CI

# Vitest + lint + tsc. Runs on every push to main and every PR
# targeting main. Decoupled from the Docker workflow so a slow
# image push never blocks the unit-test feedback loop.

on:
  push:
    branches: [main]
    tags: ['v*']
    # M-CI-COST-1: skip CI on planning-only commits.
    paths-ignore:
      - 'devplan/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'devplan/**'
  # M-CI-1: callable as a gate from docker-publish.yml.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:biome

      - name: Type-check + build
        run: npm run build

      - name: Run vitest suite
        run: npm test

  image-scan:
    # M-ACP-NPM-STRIP-1 (2026-08-02): cerase-acp had NO image scan at all, while
    # its sibling cerase-agent — the same node base, the same bundled npm — was
    # gated by Trivy. The exposure here was never absent, only unalarmed, and an
    # asymmetry like that is how one of two identical images stays vulnerable.
    # Blocking, like cerase-agent's: HIGH/CRITICAL fails the job.
    name: trivy image scan (hard block)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the runtime image
        run: docker build -t cerase-acp:scan .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: cerase-acp:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  gitleaks:
    name: gitleaks (hard block)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # M-DOCS-PARITY-ALL-REPOS-1 — no document may name a command, file or path
      # that does not exist. A parity check that lives in one repo's local suite
      # is a check for one repo, so the same script runs in every repo's CI.
      - name: Docs parity
        run: bash scripts/docs-parity.sh

      # A0 step 4 · G2 + G3 — no credential file in this checkout, no retired
      # credential name in use. Same script in every repo, synced from core by
      # `scripts/sync-tooling.sh` and pinned by `scripts/TOOLING.sha256`: a
      # secrets guard that lives in one repo guards one repo.
      - name: Secrets guard
        run: bash scripts/secrets-guard.sh
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan repository history
        run: gitleaks detect --source . --redact --verbose --exit-code 1
