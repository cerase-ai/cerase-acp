name: CI

# Vitest + lint + tsc. Runs on every push to main and every PR
# targeting main. Decoupled from the Docker workflow so a slow
# image push never blocks the unit-test feedback loop.

on:
  # M-THE-ACTIONS-BILL-IS-ONE-JOB-IN-SEVEN-1: no standalone `push` trigger.
  # docker-publish.yml already runs this suite as its `gate` via workflow_call,
  # on every push to main and every v* tag, so a push trigger here ran every job
  # a SECOND time on the same commit. Measured 2026-08-20/21 across the five
  # repositories that had one: 184 jobs and 239 billed minutes over two days,
  # and 48 of 48 commits also ran the gate — not one standalone run was the only
  # coverage. cerase-core removed its own for this reason in M-CI-COST-2.
  #
  # Nothing loses coverage here: this trigger and the publish ignored the same
  # `devplan/**`, so every push that ran CI now runs it once through the gate.
  pull_request:
    branches: [main]
    paths-ignore:
      - 'devplan/**'
  # M-CI-1: callable as a gate from docker-publish.yml.
  workflow_call:

jobs:
  test:
    name: test + guards (vitest · biome · tsc · docs/comment/secrets · gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # Full history: the comment check compares against the previous commit
        # of this push, and gitleaks scans the history rather than the tree.
        with: { fetch-depth: 0 }

      # The repository guards and the secret scan were a JOB of their own, and
      # cost a whole billed minute for seven seconds of work. GitHub bills each
      # job rounded up to a whole minute, so they are steps here now.
      #
      # Each keeps `continue-on-error` and its own id, and the verdict at the
      # end names which one refused: as a separate job they were independent of
      # the node work, and a merge that let a red vitest hide a secret finding
      # would be worse than the two jobs it replaces.
      - name: Docs parity
        id: docs_parity
        continue-on-error: true
        run: bash scripts/docs-parity.sh

      - name: Comment convention
        id: comment_check
        continue-on-error: true
        run: bash scripts/comment-check.sh --base "${COMMENT_CHECK_BASE}"
        env:
          COMMENT_CHECK_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      - name: Secrets guard
        id: secrets_guard
        continue-on-error: true
        run: bash scripts/secrets-guard.sh

      - name: Install gitleaks
        id: gitleaks_install
        continue-on-error: true
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          # --retry, because this check HARD-BLOCKS a merge and its input is a
          # third party's CDN. A 503 from the release host once reddened a repo
          # whose code was fine, and a security gate that fails on somebody
          # else's outage is a gate people learn to re-run without reading.
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan repository history
        id: gitleaks
        continue-on-error: true
        run: gitleaks detect --source . --redact --verbose --exit-code 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:biome

      - name: Type-check + build
        run: npm run build

      - name: Run vitest suite
        run: npm test

      # Which of the merged checks refused. `always()` is what keeps a red
      # vitest from hiding a secret finding.
      - name: Which check refused
        if: always()
        env:
          DOCS: ${{ steps.docs_parity.outcome }}
          COMMENTS: ${{ steps.comment_check.outcome }}
          SECRETS: ${{ steps.secrets_guard.outcome }}
          GITLEAKS_INSTALL: ${{ steps.gitleaks_install.outcome }}
          GITLEAKS: ${{ steps.gitleaks.outcome }}
        run: |
          set -uo pipefail
          red=""
          [ "$DOCS" = failure ] && red="$red docs-parity"
          [ "$COMMENTS" = failure ] && red="$red comment-check"
          [ "$SECRETS" = failure ] && red="$red secrets-guard"
          [ "$GITLEAKS_INSTALL" = failure ] && red="$red gitleaks(install)"
          [ "$GITLEAKS" = failure ] && red="$red gitleaks"
          if [ -n "$red" ]; then
            echo "::error::these blocking checks refused:$red"
            exit 1
          fi
          echo "the repository guards and the secret scan all passed"

  image-scan:
    # M-ACP-NPM-STRIP-1 (2026-08-02): cerase-acp had NO image scan at all, while
    # its sibling cerase-agent — the same node base, the same bundled npm — was
    # gated by Trivy. The exposure here was never absent, only unalarmed, and an
    # asymmetry like that is how one of two identical images stays vulnerable.
    # Blocking, like cerase-agent's: HIGH/CRITICAL fails the job.
    name: trivy image scan (hard block)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the runtime image
        run: docker build -t cerase-acp:scan .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: cerase-acp:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
