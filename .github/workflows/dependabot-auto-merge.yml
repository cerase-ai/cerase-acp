# M-ACP-DEPENDABOT-9-1 — who merges the security PRs, and when.
#
# The finding that opened this was wrong in an instructive way. I recorded that
# automated security fixes "did not open a PR"; they had opened five, one per
# advisory, the same day the alerts appeared. The control worked exactly as
# designed. **Nobody empties it** — eight PRs were open, the oldest from
# 2026-06-30, six weeks.
#
# A tool that opens a PR nobody merges is not a safety net, it is a queue, and a
# queue with no owner is indistinguishable from a tool that is off. So the owner
# is this workflow.
#
# ⚠️ **Patch and minor only, and never a major.** A major is an API change
# wearing a version number: it belongs to whoever has to fix what it breaks, and
# auto-merging one is how a dependency bot becomes the thing that broke main.
# Majors stay open and are somebody's decision, which is the correct amount of
# friction for a decision.
#
# ⚠️ **And the rule is an ALLOW-list, because the deny-list let a major through.**
# Measured 2026-09-08 on `cerase-core` PR #58: a GROUPED bump — nine dependencies
# across three directories — carried `mcp` 1.x→2.x and `openai` 1.x→3.x, and
# `dependabot/fetch-metadata` reported **`update-type: null`**, because a group
# has no single update type. The old condition was `update-type != major`, and
# `null != major` is true, so the workflow queued it and merged it. `mcp` 2.x
# renamed `FastMCP` to `MCPServer`; three first-party MCP servers stopped
# importing, the lint gate went red on two pushes, and NONE of this repo's ten
# images was published for the rest of the day.
#
# The shape is the one this workspace keeps paying for: **a guard that decides on
# the ABSENCE of a value treats an unknown as a pass.** So the condition below
# names the two values that are allowed and refuses everything else — a group, an
# empty string, a value the action adds next year. A grouped PR now stays open,
# which is the correct outcome: nobody can say what a group contains from one
# field, and a person opening it can.
#
# Every run on the pull request's commit is the gate. The merge waits until each
# other workflow run on that commit has finished and merges only when all of
# them succeeded, so an update that breaks the build, or an image that does not
# start, stays open with a red on it, which is the outcome an operator should
# see. Waiting on `--auto` is not enough: with no required checks the gh CLI
# merges a mergeable pull request at once, and branch protection, the only way
# to require a check, is not available to a private repository on a free plan.
name: Dependabot auto-merge

# The mapping form, not the scalar `on: pull_request_target`.
#
# Both mean the same thing to GitHub — no `types:` is every default type — but a
# scalar is a STRING to anything that parses the workflow, and
# `cerase-marketplace` has a case that walks every workflow's triggers and reds
# on one that is not a mapping. It went red the moment this file was vendored
# there. Uniform shape, one less thing for a reader to special-case.
on:
  pull_request_target:

# Reading the runs on the commit needs `actions: read`; a permissions block
# grants nothing it does not name.
permissions:
  actions: read
  contents: write
  pull-requests: write

# A newer commit on the pull request replaces the wait on the older one, and
# `--match-head-commit` below refuses a merge the older wait would still attempt.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # The bound on the wait: a run that never finishes leaves the pull request
    # open with this job red, rather than a runner waiting for ever.
    timeout-minutes: 120
    steps:
      - name: What kind of bump is this
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The merge waits for every other workflow run on the pull request's head
      # commit to finish, and merges only when each one succeeded.
      #
      # Runs rather than check runs, because a run exists from the moment its
      # event fires, while the jobs of a matrix appear only once the job that
      # computes the matrix has finished. Runs of this workflow are neither
      # waited on nor counted: this job is one of them. A commit no other
      # workflow ran on is not merged, because nothing has checked it.
      # `--match-head-commit` refuses the merge when the pull request moved past
      # the commit that was checked, and `--auto` still queues it behind any
      # required check a repository has.
      - name: Wait for this commit's other runs, then merge
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: |
          set -uo pipefail
          poll="${CERASE_AUTO_MERGE_POLL_SECONDS:-30}"
          empty=0
          while :; do
            if ! runs="$(gh api "repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" \
                --jq '.workflow_runs[] | select(.name != env.WORKFLOW) | [.name, .status, (.conclusion // "")] | @tsv')"; then
              echo "the runs on ${HEAD_SHA} could not be read; reading again"
              sleep "$poll"
              continue
            fi
            if [ -z "$runs" ]; then
              empty=$((empty + 1))
              if [ "$empty" -ge 3 ]; then
                {
                  echo "## Not merged"
                  echo
                  echo "No other workflow ran on ${HEAD_SHA}, so nothing has checked this update."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              sleep "$poll"
              continue
            fi
            empty=0
            if awk -F'\t' '$2 != "completed" { waiting = 1 } END { exit !waiting }' <<< "$runs"; then
              sleep "$poll"
              continue
            fi
            failed="$(awk -F'\t' '$3 != "success" && $3 != "skipped" && $3 != "neutral" { printf "%s%s (%s)", sep, $1, $3; sep = ", " }' <<< "$runs")"
            if [ -n "$failed" ]; then
              gh pr comment "$PR_URL" --body \
                "Left open deliberately: on ${HEAD_SHA}, ${failed} did not succeed, and an update merges only after every run on its commit has. See \`.github/workflows/dependabot-auto-merge.yml\`."
              {
                echo "## Not merged"
                echo
                echo "Did not succeed on ${HEAD_SHA}: ${failed}"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            break
          done
          if gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"; then
            echo "Merged after every other run on ${HEAD_SHA} succeeded." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Not merged, and this is not a failure"
            echo
            echo "Every run on the commit succeeded and the merge was refused: the"
            echo "pull request moved past that commit, or it cannot be merged as it"
            echo "stands. Auto-merge itself can only be enabled for a public"
            echo "repository on a free organisation. The PR stays open for a person."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Everything the allow-list did not take. A major says so; a group says
      # what it is instead of being described as a major it may not be — the
      # comment has to be true for a reader who opens the PR and counts nine
      # dependencies in it.
      - name: Say why it was left alone
        if: >-
          steps.meta.outputs.update-type != 'version-update:semver-patch' &&
          steps.meta.outputs.update-type != 'version-update:semver-minor'
        run: |
          set -uo pipefail
          if [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then
            motivo='a major is not auto-merged. A major is an API change wearing a version number, and it belongs to whoever has to fix what it breaks.'
          else
            motivo="this PR reports no single update type (\`${UPDATE_TYPE:-empty}\`, group \`${GROUP:-none}\`), so nothing here can tell whether it contains a major. On 2026-09-08 a group in exactly this shape carried two majors, was auto-merged, and stopped this repo publishing any image for a day."
          fi
          gh pr comment "$PR_URL" --body \
            "Left open deliberately: $motivo See \`.github/workflows/dependabot-auto-merge.yml\`."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          GROUP: ${{ steps.meta.outputs.dependency-group }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
