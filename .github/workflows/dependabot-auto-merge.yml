# M-ACP-DEPENDABOT-9-1 — who merges the security PRs, and when.
#
# The finding that opened this was wrong in an instructive way. I recorded that
# automated security fixes "did not open a PR"; they had opened five, one per
# advisory, the same day the alerts appeared. The control worked exactly as
# designed. **Nobody empties it** — eight PRs were open, the oldest from
# 2026-06-30, six weeks.
#
# A tool that opens a PR nobody merges is not a safety net, it is a queue, and a
# queue with no owner is indistinguishable from a tool that is off. So the owner
# is this workflow.
#
# ⚠️ **Patch and minor only, and never a major.** A major is an API change
# wearing a version number: it belongs to whoever has to fix what it breaks, and
# auto-merging one is how a dependency bot becomes the thing that broke main.
# Majors stay open and are somebody's decision, which is the correct amount of
# friction for a decision.
#
# ⚠️ **And the rule is an ALLOW-list, because the deny-list let a major through.**
# Measured 2026-09-08 on `cerase-core` PR #58: a GROUPED bump — nine dependencies
# across three directories — carried `mcp` 1.x→2.x and `openai` 1.x→3.x, and
# `dependabot/fetch-metadata` reported **`update-type: null`**, because a group
# has no single update type. The old condition was `update-type != major`, and
# `null != major` is true, so the workflow queued it and merged it. `mcp` 2.x
# renamed `FastMCP` to `MCPServer`; three first-party MCP servers stopped
# importing, the lint gate went red on two pushes, and NONE of this repo's ten
# images was published for the rest of the day.
#
# The shape is the one this workspace keeps paying for: **a guard that decides on
# the ABSENCE of a value treats an unknown as a pass.** So the condition below
# names the two values that are allowed and refuses everything else — a group, an
# empty string, a value the action adds next year. A grouped PR now stays open,
# which is the correct outcome: nobody can say what a group contains from one
# field, and a person opening it can.
#
# The green suite is the gate. `--auto` queues the merge behind the required
# checks rather than merging now, so a bump that breaks the build stays open with
# a red on it — which is the outcome an operator should see.
name: Dependabot auto-merge

# The mapping form, not the scalar `on: pull_request_target`.
#
# Both mean the same thing to GitHub — no `types:` is every default type — but a
# scalar is a STRING to anything that parses the workflow, and
# `cerase-marketplace` has a case that walks every workflow's triggers and reds
# on one that is not a mapping. It went red the moment this file was vendored
# there. Uniform shape, one less thing for a reader to special-case.
on:
  pull_request_target:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: What kind of bump is this
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: `--auto` needs `allow_auto_merge` ON, which is a repo SETTING and
      # not a file -- and on a FREE organisation it can only be turned on for a
      # PUBLIC repository. Measured across this org: true on exactly the two
      # public repos and refused on the six private ones, with the API answering
      # 200 and returning `false`. A setting that succeeds and does not apply is
      # a shape this workspace has been caught by before.
      #
      # So the step SAYS SO instead of failing. A red job on every Dependabot PR
      # in six repos is noise nobody can act on: the plan is the constraint, not
      # the configuration.
      - name: Queue it behind the checks
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: |
          set -uo pipefail
          if gh pr merge --auto --squash "$PR_URL"; then
            echo "Queued behind the required checks." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Not queued, and this is not a failure"
            echo
            echo "Auto-merge was refused. On a free organisation it can only be"
            echo "enabled for a public repository, and this one is private — so"
            echo "nothing here can own the queue and the PR stays open for a"
            echo "person to look at."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Everything the allow-list did not take. A major says so; a group says
      # what it is instead of being described as a major it may not be — the
      # comment has to be true for a reader who opens the PR and counts nine
      # dependencies in it.
      - name: Say why it was left alone
        if: >-
          steps.meta.outputs.update-type != 'version-update:semver-patch' &&
          steps.meta.outputs.update-type != 'version-update:semver-minor'
        run: |
          set -uo pipefail
          if [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then
            motivo='a major is not auto-merged. A major is an API change wearing a version number, and it belongs to whoever has to fix what it breaks.'
          else
            motivo="this PR reports no single update type (\`${UPDATE_TYPE:-empty}\`, group \`${GROUP:-none}\`), so nothing here can tell whether it contains a major. On 2026-09-08 a group in exactly this shape carried two majors, was auto-merged, and stopped this repo publishing any image for a day."
          fi
          gh pr comment "$PR_URL" --body \
            "Left open deliberately: $motivo See \`.github/workflows/dependabot-auto-merge.yml\`."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          GROUP: ${{ steps.meta.outputs.dependency-group }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
