name: Build & publish Docker image

# Builds the cerase-acp Docker image and publishes it to the
# GitHub Container Registry (ghcr.io/cerase-ai/cerase-acp).
#
# Triggers:
#   - push to main           → tags: latest, main, sha-<short>
#   - push of a `v*` git tag → tags: <tag>, <semver>, latest (only if not pre-release)
#   - manual workflow_dispatch (any branch)
#
# M-CI-COST-2: the team pushes directly to main (PRs are dependabot-only) and
# the PR build was validation-only (no push) — the most expensive PR step.
# Dropped the pull_request trigger; a Dockerfile break is caught on merge to main.

on:
  push:
    branches: [main]
    tags: ['v*']
    # M-CI-COST-1: skip image builds on planning-only commits.
    paths-ignore:
      - 'devplan/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cerase-acp

# M-CI-1: serialise publishes per ref so two rapid pushes can't race
# and move :latest backwards.
# M-CI-COST-1: cancel superseded branch builds (cheaper + safer for :latest);
# tag builds must finish.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # M-CI-1: gate the publish on a green suite. needs: only works within
  # one workflow, so call the reusable ci workflow and depend on it.
  gate:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: [gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata + tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tagging strategy:
          #   - branch=main          → tag `main` + tag `latest`
          #   - branch != main       → tag `<branch-slug>`
          #   - git tag v1.2.3       → tag `v1.2.3` + tag `1.2.3` + tag `1.2`
          #                             + tag `latest` (skipped on pre-release like v1.2.3-rc.1)
          #   - any commit           → tag `sha-<7-char>`
          # `latest` is auto-managed: only attached to default branch +
          # to non-prerelease tags. PR builds get `pr-<n>` (no push anyway).
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=cerase-acp
            org.opencontainers.image.description=Multi-channel DM bridge for Cerase (Discord / Slack / Workspace Chat / Telegram)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      # Build the image into the local daemon first, so the image Trivy scans
      # is the one this job pushes. The gate's own scan runs on pull requests
      # only: on a push it built a second image that was never published.
      #
      # The runtime stage is excluded from the cache, and that exclusion is
      # what lets a blocking scan be satisfied at all. That stage runs
      # apt-get upgrade, and a cached layer keeps the debian packages of
      # whichever day it was first built, so a re-run after debian publishes a
      # fix would rebuild the same vulnerable image. The build stage stays
      # cached: npm ci and tsc are the expensive steps, the apt layer is
      # seconds.
      - name: Build image (load for scan)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: cerase-acp:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache-filters: runtime
          provenance: false

      # Blocking: any HIGH or CRITICAL with a published fix, in the OS layer
      # or in node_modules, stops the publish before a tag moves.
      - name: Trivy image scan (HIGH/CRITICAL block)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: cerase-acp:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Deliberately NOT excluding the runtime stage here. This build has to
      # reproduce the image Trivy just approved, and it does that by reading
      # the cache the scan build wrote a moment ago; a second apt run could
      # meet a different mirror snapshot and push packages nobody scanned.
      - name: Build & push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
