# A merge this repository performs on itself wakes nothing.
#
# `dependabot-auto-merge.yml` squash-merges with `secrets.GITHUB_TOKEN`, and
# GitHub does not raise events for anything that token does -- deliberately, so
# a workflow cannot trigger itself in a loop. The merge lands on `main` and no
# `push` event exists, so `docker-publish.yml` never starts. Nothing is red:
# nothing ran.
#
# Measured 2026-09-05. `feb52bc` bumped `qs` 6.15.3 -> 6.16.0 on 2026-09-03 and
# carried zero workflow runs of any kind for two days, while `:latest` served
# the code from before a dependency security fix.
#
# ⚠️ **Reacting to the merge cannot work, and that is the trap.** The obvious
# repair -- a job on `pull_request_target: closed` that publishes once the PR is
# merged -- is suppressed by the same rule that suppressed the push. Every event
# descending from that merge is silent, so the trigger has to come from outside
# it. Hence a schedule.
#
# `workflow_dispatch` is the documented exception: the token may START a run
# even though it may not cause one. `cerase-core`'s fleet watcher already relies
# on that to retry its own publishes, and this is the same recovery moved into
# the repository that structurally needs it. It needs no credential -- the
# cross-repo watcher can only report this repo's gap, because dispatching a
# SIBLING's workflow needs a PAT that does not exist yet.

name: Publish the head that has none

on:
  schedule:
    # Once a day, an hour before the fleet watcher's morning pass, so a gap this
    # repository can close itself is closed before the watcher files it.
    - cron: '25 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # To START this repository's own publish. Dispatching is a write even though
  # what it starts only reads.
  actions: write
  # To ASK the registry what it holds. A run's colour is a statement about a
  # run; a tag is a fact about the world, and only the second is what a deploy
  # can pull -- `fleet-red-main.yml` in cerase-core draws the same distinction
  # and for the same reason.
  packages: read

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Enough history to walk back past a run of planning-only commits to
          # the newest one an image was ever expected for.
          fetch-depth: 25

      - name: Which commit should the registry be holding, and does it?
        id: ask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          # The publish ignores `devplan/**`, so a planning-only commit
          # correctly produces no image and main's head legitimately has none.
          # The commit to ask about is the newest one that ISN'T planning-only.
          # Without this the self-heal would read every devplan commit as a gap
          # and rebuild the image every morning, on a repository whose Actions
          # bill is a standing concern.
          sha=""
          for c in $(git rev-list -n 25 HEAD); do
            if git show --name-only --format= "$c" | grep -qv '^devplan/'; then
              sha="$c"; break
            fi
          done

          if [ -z "$sha" ]; then
            echo "verdict=not-expected" >> "$GITHUB_OUTPUT"
            echo "short=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"

          # ASK THE REGISTRY, not the run list. A cancelled publish leaves a run
          # behind, so counting runs answers "it ran" for the single most common
          # cause of a missing image -- a run superseded by a later push is
          # never retried, and that trap is already recorded in this workspace.
          # The tag is the fact a deploy can actually pull.
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null 2>&1

          ref="ghcr.io/${GITHUB_REPOSITORY_OWNER}/cerase-acp:sha-${sha:0:7}"
          out="$(docker manifest inspect "$ref" 2>&1)"; status=$?

          # THREE outcomes, not two. "I could not look" is not "it is not
          # there", and collapsing them dispatches a full image build every
          # morning for a registry that is merely refusing us.
          if [ "$status" -eq 0 ]; then
            echo "verdict=held" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$out" | grep -qiE 'manifest unknown|not found'; then
            echo "verdict=missing" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=unreadable" >> "$GITHUB_OUTPUT"
            printf 'registry said: %s\n' "$out"
          fi

      - name: Publish it
        if: steps.ask.outputs.verdict == 'missing'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run docker-publish.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched the publish for ${{ steps.ask.outputs.sha }}." >> "$GITHUB_STEP_SUMMARY"

      - name: Say what was found
        run: |
          {
            echo "main is at \`${{ steps.ask.outputs.short }}\` — **${{ steps.ask.outputs.verdict }}**"
            echo
            case "${{ steps.ask.outputs.verdict }}" in
              held)         echo "The registry holds this commit. Nothing to do." ;;
              not-expected) echo "Only \`devplan/\` has changed, so no image was ever meant to carry it." ;;
              missing)      echo "The registry does not hold it. A publish has been dispatched." ;;
              unreadable)   echo "The registry could not be read, so nothing was dispatched. Not the same as an absent image." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
