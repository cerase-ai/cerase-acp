# A repo publishes its own missed head, with no credential.
#
# The fleet watcher in cerase-core finds a commit the registry does not carry
# and RETRIES the publish before it files. That retry reaches only the
# repository it lives in: dispatching a SIBLING's workflow is a write on another
# repository, and `github.token` cannot do it. The answer was going to be a
# fine-grained PAT with write on actions across the org.
#
# It is not needed. `workflow_dispatch` is the documented exception to the rule
# that a token may not cause its own events -- it may START a run -- so a repo
# can always dispatch ITS OWN publish. One file, identical in every repo, and
# nothing to create, rotate or forget has expired.
#
# ── What makes a head unpublished ──
#
# Two causes, and they are the two the watcher's retry exists for:
#
#   - NO RUN AT ALL. A merge performed with `secrets.GITHUB_TOKEN` raises no
#     events -- deliberately, so a workflow cannot trigger itself in a loop --
#     so a Dependabot auto-merge lands on main and wakes nothing. Nothing is
#     red: nothing ran.
#   - A CANCELLED RUN. Two pushes in quick succession, and the concurrency group
#     kills the first. A superseded run is never retried, because the next
#     push's path filter diffs against its own parent and sees nothing to do.
#
# A FAILED run is deliberately not retried. A publish that failed is a fix to
# push, not a dice roll, and a workflow that re-dispatches it every morning
# burns a runner to reproduce the same red.
#
# ── What it does NOT cover, said out loud ──
#
# A run that SUCCEEDED while publishing nothing. That is what a path filter does
# on purpose, and telling the two apart needs the image names and the registry.
# The fleet watcher still asks the registry twice a day and still reports it;
# what moved here is the ACT, not the detection.

name: Publish the head that has none

on:
  schedule:
    # Once a day, an hour before the fleet watcher's morning pass, so a gap a
    # repository can close itself is closed before the watcher files it.
    - cron: '25 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # To START this repository's own publish. Dispatching is a write even though
  # what it starts only reads.
  actions: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Enough history to walk back past a run of commits the publish
          # ignores by path.
          fetch-depth: 50

      - name: Which commit should have an image, and has it been through the publish?
        id: ask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          # The publish workflow, by the same candidate names `registry-check`
          # walks: the repos here do not agree on one. First that exists wins,
          # and every repo carrying this file has exactly one of them.
          wf=""
          for f in docker-publish.yml publish.yml ci.yml; do
            [ -f ".github/workflows/$f" ] && { wf="$f"; break; }
          done
          if [ -z "$wf" ]; then
            echo "verdict=no-publish-workflow" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "workflow=$wf" >> "$GITHUB_OUTPUT"

          # Its own `paths-ignore`, read from the workflow rather than restated
          # here: the patterns differ per repo and a copy would go stale in six
          # of the seven.
          mapfile -t ignore < <(
            sed -n '/^[[:space:]]*paths-ignore:/,/^[[:space:]]*[a-z_-]*:/p' ".github/workflows/$wf" \
              | sed -n "s/^[[:space:]]*-[[:space:]]*['\"]\{0,1\}\([^'\"]*\)['\"]\{0,1\}[[:space:]]*$/\1/p"
          )

          # Two substitutions cover both shapes that occur: `docs/**` becomes
          # `docs/*` and `**/*.md` becomes `*.md`. A `case` glob spans `/`, so
          # the first matches at any depth and the second matches at the root.
          ignored() {
            local g="$1" p="$2"
            p="${p//\*\*\//}"
            p="${p//\*\*/\*}"
            case "$g" in $p) return 0 ;; esac
            return 1
          }

          # The newest commit the publish was meant to fire on. Without this a
          # docs-only head would be dispatched every morning: it correctly has
          # no run, for ever.
          sha=""
          for c in $(git rev-list -n 50 HEAD); do
            expected=0
            while IFS= read -r changed; do
              [ -n "$changed" ] || continue
              hit=0
              for p in ${ignore[@]+"${ignore[@]}"}; do
                ignored "$changed" "$p" && { hit=1; break; }
              done
              [ "$hit" -eq 1 ] || { expected=1; break; }
            done < <(git show --name-only --format= "$c")
            [ "$expected" -eq 1 ] && { sha="$c"; break; }
          done

          if [ -z "$sha" ]; then
            echo "verdict=not-expected" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"

          # By workflow PATH, never by display name: a filter on the name goes
          # blind the day somebody renames the workflow, and goes blind
          # SILENTLY -- it reports "no run" for a publish that ran.
          # NOTE: `.conclusion // "pending"`, and the fallback is the whole of
          # it. A queued or running publish has a NULL conclusion, which `@csv`
          # renders as an empty string -- indistinguishable from "no run at
          # all", so a commit whose build was still in flight got a SECOND one
          # dispatched on top of it. Caught by running this for real; no offline
          # case could see it, because a stub answers a finished list.
          runs="$(gh api \
                    "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?head_sha=${sha}&per_page=20" \
                    --jq '[.workflow_runs[] | (.conclusion // "pending")] | @csv' 2>/dev/null || echo unreadable)"

          # THREE outcomes, not two. A list we could not read is not an empty
          # list, and treating it as one dispatches a build every morning for a
          # repository whose API is merely refusing us.
          if [ "$runs" = "unreadable" ]; then
            echo "verdict=unreadable" >> "$GITHUB_OUTPUT"
          elif [ -z "${runs//[\"\',]/}" ]; then
            echo "verdict=missing" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$runs" | grep -q 'success'; then
            echo "verdict=published" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$runs" | grep -q 'cancelled'; then
            # A superseded run is never retried by anything else.
            echo "verdict=cancelled" >> "$GITHUB_OUTPUT"
          else
            # Failed, or still running. Neither is ours to repeat: a red is a
            # fix to push, and a build in flight is already doing the work.
            echo "verdict=ran" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish it
        if: steps.ask.outputs.verdict == 'missing' || steps.ask.outputs.verdict == 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "${{ steps.ask.outputs.workflow }}" \
            --repo "$GITHUB_REPOSITORY" --ref main

      - name: Say what was found
        run: |
          {
            echo "publish workflow: \`${{ steps.ask.outputs.workflow }}\`"
            echo
            echo "commit an image was expected for: \`${{ steps.ask.outputs.short }}\` — **${{ steps.ask.outputs.verdict }}**"
            echo
            case "${{ steps.ask.outputs.verdict }}" in
              published)  echo "It has been through the publish. Nothing to do." ;;
              ran)        echo "A run exists and did not succeed. A failed publish is a fix to push, not a retry." ;;
              cancelled)  echo "Its newest run was cancelled by a later push, and nothing else retries one. Dispatched." ;;
              missing)    echo "No run of the publish exists for it. Dispatched." ;;
              not-expected) echo "Every commit in range is one the publish ignores by path, so no image was ever meant to carry them." ;;
              unreadable) echo "The run list could not be read, so nothing was dispatched. Not the same as no runs." ;;
              no-publish-workflow) echo "This repository has no publish workflow under any known name." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
