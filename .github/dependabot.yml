# M-DEPS-1: weekly dependency updates for the DM bridge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    labels: [deps, js]
    # M-CI-COST-2: collapse all npm updates into one PR.
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    labels: [deps, docker]
    # M-CI-COST-2: collapse all docker updates into one PR.
    groups:
      docker:
        patterns: ["*"]
    # php and python publish their next minor as alpha, beta and rc tags first,
    # and Dependabot proposes them as a minor bump: php 8.6.0beta3 reached
    # cerase-dash that way on 2026-09-26 and every machine stopped reading the
    # console. A runtime's minor or major is an upgrade made on purpose; patches
    # still arrive. node publishes no pre-release image tags, so only its majors
    # wait.
    ignore:
      - dependency-name: php
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    labels: [deps, ci]
    # M-CI-COST-2: collapse all github-actions updates into one PR.
    groups:
      actions:
        patterns: ["*"]
